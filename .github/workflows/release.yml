# Builds Plunder.exe on Windows and publishes it as a GitHub release whenever a tag like v1.7.0 is pushed.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Plunder.exe
        run: npx electron-builder --win portable --x64 --publish never
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Plunder ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/Plunder.exe
